[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirects & Rewrites
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# Optional backend proxy: To connect Netlify to a self-hosted or cloud backend (e.g. Render / Fly.io),
# uncomment the block below with your deployed backend server address:
# [[redirects]]
#   from = "/api/*"
#   to = "https://api.safespace-bremen.de/api/:splat"
#   status = 200
#   force = true
